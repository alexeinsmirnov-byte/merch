<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления GitHub // A.LABEL</title>
    <style>
        body { background-color: #0A0A0A; color: #FFFFFF; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .admin-box { background: #121212; border: 1px solid #27272a; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: max-width 0.3s; }
        .admin-box.wide { max-width: 1000px; width: 100%; }
        h2 { color: #39FF14; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; font-weight: 900; font-size: 22px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; color: #a1a1aa; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; background: #18181b; border: 1px solid #27272a; border-radius: 6px; padding: 12px; color: #FFFFFF; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #39FF14; }
        .btn-action { width: 100%; background: #39FF14; color: #000000; border: none; padding: 12px; border-radius: 6px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        .btn-action:hover { background: #32e011; }
        .btn-action:disabled { background: #555555; color: #aaaaaa; cursor: not-allowed; }
        .error-msg { color: #ff3333; font-size: 13px; margin-top: 15px; padding: 12px; background: rgba(255,51,51,0.1); border: 1px solid #ff3333; border-radius: 6px; display: none; text-align: left; line-height: 1.4; font-weight: bold; }
        .dashboard { display: none; text-align: left; }
        .dashboard.active { display: block; }
        .login-form.hidden { display: none; }
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #27272a; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; background: #18181b; min-width: 600px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #27272a; }
        th { background: #27272a; color: #39FF14; text-transform: uppercase; font-size: 11px; font-weight: bold; }
        tr:hover { background: #202024; }
        .loading { color: #a1a1aa; font-style: italic; text-align: center; padding: 20px 0; }
        .add-order-box { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="admin-box" id="mainContainer">
        <div id="loginForm">
            <h2>Вход в GitHub Админку</h2>
            <div class="input-group">
                <label>Имя пользователя GitHub (Логин)</label>
                <input type="text" id="githubUser" placeholder="Например: alexeinsmirnov-byte">
            </div>
            <div class="input-group">
                <label>Имя репозитория</label>
                <input type="text" id="githubRepo" value="merch">
            </div>
            <div class="input-group">
                <label>GitHub Personal Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button onclick="initAdmin()" class="btn-action" id="connectBtn">Подключиться к базе</button>
            <div id="error" class="error-msg"></div>
        </div>

        <div id="dashboard" class="dashboard">
            <h2>Панель заказов (Файл: orders.json)</h2>
            
            <div class="add-order-box">
                <h4 style="margin: 0 0 10px 0; color: #39FF14;">Добавить новый заказ в базу</h4>
                <div class="grid-inputs">
                    <input type="text" id="newOrderItems" placeholder="Товар">
                    <input type="text" id="newOrderPrice" placeholder="Цена">
                    <input type="text" id="newOrderName" placeholder="Имя">
                    <input type="text" id="newOrderContact" placeholder="Контакты">
                    <input type="text" id="newOrderAddress" placeholder="Адрес">
                </div>
                <button onclick="addNewOrder()" class="btn-action" style="margin-top:0; padding: 8px; font-size:12px;">Сохранить заказ на GitHub</button>
            </div>

            <div style="margin-bottom: 15px;">
                <button onclick="loadGitHubOrders()" class="btn-action" style="width: auto; padding: 8px 15px; margin-right: 10px; display: inline-block; font-size: 12px; margin-top: 0;">Обновить список</button>
                <button onclick="logout()" class="btn-action" style="width: auto; padding: 8px 15px; background: #ffffff; color: #000000; display: inline-block; font-size: 12px; margin-top: 0;">Выйти</button>
            </div>
            
            <div class="table-container">
                <div id="loadingText" class="loading">Загрузка данных из GitHub...</div>
                <table id="ordersTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Товар</th>
                            <th>Цена</th>
                            <th>Имя</th>
                            <th>Контакты</th>
                            <th>Адрес</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentSha = ""; 

        async function initAdmin() {
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const token = document.getElementById('githubToken').value.trim();
            const errorDiv = document.getElementById('error');
            const connectBtn = document.getElementById('connectBtn');
            
            errorDiv.style.display = 'none';
            errorDiv.innerText = '';

            // 1. Проверка на пустые строки формы
            if(!user || !repo || !token) {
                errorDiv.innerText = "⚠ Ошибка: Вы заполнили не все поля! Пожалуйста, обязательно введите Логин, Репозиторий и Секретный токен.";
                errorDiv.style.display = 'block';
                return;
            }

            // Включаем режим анимации загрузки
            connectBtn.disabled = true;
            connectBtn.innerText = "Проверка данных...";

            const url = `https://api.github.com/repos/${user}/${repo}/contents/orders.json`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                
                // 2. Обработка системных ошибок авторизации GitHub
                if(!response.ok) {
                    if(response.status === 401 || response.status === 403) {
                        throw new Error("Неверный GitHub Personal Token! Перепроверьте буквы токена (он должен начинаться на ghp_).");
                    } else if(response.status === 404) {
                        throw new Error(`Не найден файл базы. Проверьте:\n1. Правильно ли написан ваш логин (${user})\n2. Имя репозитория (${repo})\n3. Создан ли внутри файл orders.json`);
                    } else {
                        throw new Error(`Ошибка сети GitHub (Статус: ${response.status}). Попробуйте позже.`);
                    }
                }
                
                // Если проверка успешна — сохраняем и открываем главную админку
                localStorage.setItem('gh_user', user);
                localStorage.setItem('gh_repo', repo);
                localStorage.setItem('gh_token', token);

                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.add('active');
                document.getElementById('mainContainer').classList.add('wide');
                
                loadGitHubOrders();

            } catch (err) {
                // Выводим текст ошибки на экран
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
            } finally {
                connectBtn.disabled = false;
                connectBtn.innerText = "Подключиться к базе";
            }
        }

        async function loadGitHubOrders() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            
            const loadingText = document.getElementById('loadingText');
            const table = document.getElementById('ordersTable');
            const tbody = document.getElementById('tableBody');
            
            loadingText.style.display = "block";
            table.style.display = "none";
            tbody.innerHTML = "";

            const url = `https://api.github.com/repos/${user}/${repo}/contents/orders.json`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                
                if(!response.ok) throw new Error("Не удалось прочитать базу.");
                
                const fileData = await response.json();
                currentSha = fileData.sha; 
                
                const utf8String = decodeURIComponent(atob(fileData.content).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                const orders = JSON.parse(utf8String);

                if (orders.length === 0) {
                    loadingText.innerText = "Заказов в файле orders.json пока нет.";
                    return;
                }

                loadingText.style.display = "none";
                table.style.display = "table";

                for (let i = orders.length - 1; i >= 0; i--) {
                    let order = orders[i];
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: #a1a1aa; font-size: 12px;">${order.date || '—'}</td>
                        <td style="font-weight: bold;">${order.item || '—'}</td>
                        <td style="color: #39FF14; font-weight: bold;">${order.price || '—'}</td>
                        <td>${order.name || '—'}</td>
                        <td style="color: #39FF14;">${order.contact || '—'}</td>
                        <td style="font-size: 13px;">${order.address || '—'}</td>
                    `;
                    tbody.appendChild(tr);
                }

            } catch (err) {
                loadingText.innerText = "Ошибка обновления данных таблицы.";
                console.error(err);
            }
        }

        async function addNewOrder() {
            const item = document.getElementById('newOrderItems').value.trim();
            const price = document.getElementById('newOrderPrice').value.trim();
            const name = document.getElementById('newOrderName').value.trim();
            const contact = document.getElementById('newOrderContact').value.trim();
            const address = document.getElementById('newOrderAddress').value.trim();

            if(!item || !name) { alert("Заполните хотя бы товар и имя покупателя!"); return; }

            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            const url = `https://api.github.com/repos/${user}/${repo}/contents/orders.json`;
            let orders = [];

            try {
                const response = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                const fileData = await response.json();
                currentSha = fileData.sha;
                const utf8String = decodeURIComponent(atob(fileData.content).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                orders = JSON.parse(utf8String);
            } catch(e) {}

            const newOrder = {
                date: new Date().toLocaleString('ru-RU'),
                item: item,
                price: price,
                name: name,
                contact: contact,
                address: address
            };
            orders.push(newOrder);

            const jsonString = JSON.stringify(orders, null, 2);
            const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

            try {
                const putResponse = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Добавлен новый заказ через Панель управления",
                        content: base64Content,
                        sha: currentSha
                    })
                });

                if(putResponse.ok) {
                    document.getElementById('newOrderItems').value = "";
                    document.getElementById('newOrderPrice').value = "";
                    document.getElementById('newOrderName').value = "";
                    document.getElementById('newOrderContact').value = "";
                    document.getElementById('newOrderAddress').value = "";
                    loadGitHubOrders();
                } else {
                    alert("Не удалось сохранить файл на GitHub.");
                }
            } catch(err) {
                alert("Ошибка сети при отправке на GitHub.");
            }
        }

        function logout() {
            localStorage.clear();
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('mainContainer').classList.remove('wide');
        }

        window.onload = function() {
            if(localStorage.getItem('gh_token')) {
                document.getElementById('githubUser').value = localStorage.getItem('gh_user');
                document.getElementById('githubRepo').value = localStorage.getItem('gh_repo');
                document.getElementById('githubToken').value = localStorage.getItem('gh_token');
                initAdmin();
            }
        }
    </script>
</body>
</html>
