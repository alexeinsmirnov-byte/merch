<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления // A.LABEL</title>
    <style>
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-box {
            background: #121212;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            color: #39FF14;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* КОНТЕЙНЕР ДЛЯ ПОЛЯ ПАРОЛЯ И ГЛАЗИКА */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 12px;
            color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Дополнительный отступ справа в поле пароля, чтобы текст не залезал под глазик */
        #password {
            padding-right: 45px;
        }

        input:focus {
            border-color: #39FF14;
        }

        /* СТИЛЬ КНОПКИ-ГЛАЗИКА */
        .eye-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .eye-btn:hover {
            color: #39FF14;
        }

        .btn-login {
            width: 100%;
            background: #39FF14;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #32e011;
        }

        .error-msg {
            color: #ff3333;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="loginForm" class="login-form">
            <h2>Вход в Админку</h2>
            <div class="input-group">
                <label>Логин (Имя пользователя)</label>
                <input type="text" id="username" placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Введите пароль">
                    <button type="button" onclick="togglePasswordVisibility()" class="eye-btn" id="eyeIcon">👁️</button>
                </div>
            </div>
            <button onclick="checkLogin()" class="btn-login">Войти</button>
            <div id="error" class="error-msg">Неверный логин или пароль!</div>
        </div>

        <div id="dashboard" class="dashboard">
            <h2>Панель управления</h2>
            <p style="color: #a1a1aa; font-size: 14px; margin-bottom: 25px;">Вы успешно авторизовались в системе.</p>
            
            <div style="background: #18181b; border: 1px solid #27272a; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px;">
                <p style="margin: 0 0 5px 0; font-weight: bold; color: #39FF14;">Управление заказами</p>
                <p style="margin: 0; font-size: 12px; color: #a1a1aa;">Все новые заказы приходят напрямую на вашу почту через Web3Forms.</p>
            </div>

            <button onclick="logout()" class="btn-login" style="background: #ffffff; color: #000000;">Выйти</button>
        </div>
    </div>

    <script>
        // ФУНКЦИЯ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ВИДИМОСТИ ПАРОЛЯ
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = '🙈'; // Меняем иконку, когда пароль виден
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = '👁️'; // Возвращаем обычный глазик
            }
        }

        function checkLogin() {
            const userInput = document.getElementById('username').value.trim().toLowerCase();
            const passInput = document.getElementById('password').value.trim().toUpperCase();
            const errorDiv = document.getElementById('error');

            // Зашифрованные в Base64 логин "admin" и пароль "ALEX2024"
            const targetUserEnc = "YWRtaW4=";
            const targetPassEnc = "QUxFWDIwMjQ=";

            const encodedUser = btoa(userInput);
            const encodedPass = btoa(passInput);

            if (encodedUser === targetUserEnc && encodedPass === targetPassEnc) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.add('active');
                errorDiv.style.display = 'none';
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            // Сбрасываем поле пароля в скрытый режим при выходе
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            passwordInput.type = 'password';
            eyeIcon.innerText = '👁️';
        }
    </script>
</body>
</html>
