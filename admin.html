<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления // A.LABEL</title>
    <style>
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-box {
            background: #121212;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            color: #39FF14;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 12px;
            color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #39FF14;
        }

        .btn-login {
            width: 100%;
            background: #39FF14;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #32e011;
        }

        .error-msg {
            color: #ff3333;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* Панель после успешного входа */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="loginForm" class="login-form">
            <h2>Вход в Админку</h2>
            <div class="input-group">
                <label>Логин (Имя пользователя)</label>
                <input type="text" id="username" placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <button onclick="checkLogin()" class="btn-login">Войти</button>
            <div id="error" class="error-msg">Неверный логин или пароль!</div>
        </div>

        <div id="dashboard" class="dashboard">
            <h2>Панель управления</h2>
            <p style="color: #a1a1aa; font-size: 14px; margin-bottom: 25px;">Вы успешно авторизовались в системе.</p>
            
            <div style="background: #18181b; border: 1px solid #27272a; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px;">
                <p style="margin: 0 0 5px 0; font-weight: bold; color: #39FF14;">Управление заказами</p>
                <p style="margin: 0; size: 12px; color: #a1a1aa;">Все новые заказы приходят напрямую на вашу почту через Web3Forms.</p>
            </div>

            <button onclick="logout()" class="btn-login" style="background: #ffffff; color: #000000;">Выйти</button>
        </div>
    </div>

    <script>
        // Функция для шифрования текста в SHA-256
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkLogin() {
            const userInput = document.getElementById('username').value;
            const passInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // Хэш от твоего пароля "ALEX2024"
            const correctPasswordHash = "c7cc72f0fb8905e3ec5515b80a138db53be9a29e478546f04b2a8d363d6b0485";
            
            // Зашифруем то, что ввел пользователь
            const inputPasswordHash = await sha256(passInput);

            // Твой логин: admin (можно ввести любыми буквами)
            if (userInput.toLowerCase() === "admin" && inputPasswordHash === correctPasswordHash) {
                // Если всё верно — скрываем вход, показываем админку
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.add('active');
                errorDiv.style.display = 'none';
            } else {
                // Если ошибка
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
