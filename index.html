<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEX_LONG // Официальный мерч A.LABEL</title>
    <style>
        /* БАЗОВЫЕ СТИЛИ САЙТА */
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* БЕЛАЯ ШАПКА */
        header {
            background: #FFFFFF !important;
            border-bottom: 1px solid #e4e4e7;
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 10px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            background: #000000;
            padding: 4px 12px;
            border-radius: 6px;
            height: 32px;
        }

        .header-logo-img {
            height: 100% !important;
            width: auto !important;
            display: block;
            object-fit: contain;
        }

        /* ТЕМНЫЙ БАННЕР НА ГЛАВНОЙ */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #18181b, #0A0A0A);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-logo-img {
            max-width: 400px !important;
            width: 85% !important;
            height: auto !important;
            display: block;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* КАТАЛОГ ТОВАРОВ */
        .catalog-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .catalog-title {
            font-size: 32px;
            font-weight: 900;
            border-bottom: 4px solid #39FF14;
            display: inline-block;
            margin-bottom: 40px;
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .card {
            background: #121212;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img {
            background: #18181b;
            height: 200px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 16px;
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .card p {
            color: #a1a1aa;
            font-size: 14px;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: #39FF14;
            font-size: 20px;
            font-weight: 900;
        }

        .btn-buy {
            background: #FFFFFF;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* МОДАЛЬНОЕ ОКНО */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .custom-modal.active {
            display: flex;
        }

        .modal-content {
            background: #121212;
            border: 1px solid #27272a;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 24px;
            position: relative;
            box-sizing: border-box;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 28px;
            cursor: pointer;
        }

        .qr-box {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 10px;
            color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: #39FF14;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>

        <div class="header-container">
            <div class="logo-container">
